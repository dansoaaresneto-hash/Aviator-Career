name: Build Aviator Connector EXE

on:
  push:
    paths:
      - 'connector/aviator_connector.py'
      - '.github/workflows/build-connector.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller requests SimConnect

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --console --name AviatorConnector connector/aviator_connector.py

      - name: Copy EXE into the app's public folder
        run: |
          mkdir -p public/downloads
          copy dist\AviatorConnector.exe public\downloads\AviatorConnector.exe
        shell: cmd

      - name: Commit and push the updated EXE
        run: |
          git config user.name "aviator-bot"
          git config user.email "actions@github.com"
          git add public/downloads/AviatorConnector.exe
          git commit -m "chore: atualiza AviatorConnector.exe [skip ci]" || echo "Nada para commitar"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

