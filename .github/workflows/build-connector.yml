name: Build Aviator Connector EXE

permissions:
  contents: write

on:
  push:
    paths:
      - 'connector/aviator_connector.py'
      - '.github/workflows/build-connector.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller requests SimConnect

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --console --name AviatorConnector --collect-all SimConnect connector/aviator_connector.py

      # Publicamos o .exe como um GitHub Release (fora da árvore de arquivos
      # do repositório) para que ele NUNCA seja apagado quando o Google AI
      # Studio sincronizar/commitar o projeto novamente. O link de download
      # do site aponta para releases/latest/download/AviatorConnector.exe,
      # que sempre resolve para o arquivo publicado aqui.
      - name: Publish EXE as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: connector-latest
          name: Aviator Connector (build automático)
          body: "Executável gerado automaticamente a partir de connector/aviator_connector.py."
          make_latest: true
          files: dist/AviatorConnector.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


